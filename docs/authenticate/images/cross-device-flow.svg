<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" aria-labelledby="title description">
  <title id="title">Cross-device browser approval sequence</title>
  <desc id="description">A requesting browser creates a pending login and receives an activation link and matching code. An approving browser opens the link, compares the code, completes fresh login and approves explicitly. The requester polls with its separate secret and redeems once for an independent session.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315b99"/></marker></defs>
  <rect width="800" height="590" rx="16" fill="#f7f9fc"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#16283f">
    <g fill="#e5edf8" stroke="#abc0dc"><rect x="20" y="20" width="220" height="62" rx="9"/><rect x="290" y="20" width="220" height="62" rx="9"/><rect x="560" y="20" width="220" height="62" rx="9"/></g>
    <g font-size="22" font-weight="650"><text x="130" y="59">Requesting browser</text><text x="400" y="59">AuthCrunch portal</text><text x="670" y="59">Approving browser</text></g>
    <g stroke="#b5c6da" stroke-width="2" stroke-dasharray="6 7"><path d="M130 91V515"/><path d="M400 91V515"/><path d="M670 91V515"/></g>
    <g stroke="#315b99" stroke-width="2.5" marker-end="url(#arrow)"><path d="M130 143H395"/><path d="M400 208H135"/><path d="M130 283H665"/><path d="M670 368H405"/><path d="M130 443H395"/><path d="M400 508H135"/></g>
    <g font-size="20"><text x="265" y="125">1. Create pending login</text><text x="265" y="185">2. Link + matching code</text><text x="400" y="263">3. Open link; compare the code</text><text x="535" y="326">4. Complete fresh login</text><text x="535" y="351">and approve explicitly</text><text x="265" y="425">5. Poll with requester secret</text><text x="265" y="489">6. Redeem once; new session</text></g>
    <text x="400" y="557" font-size="19">The activation link carries no requester secret or bearer token.</text>
  </g>
</svg>
